[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "https://teachingwithartificialintelligence.netlify.app/*"
  to = "https://www.teachingwithai.app/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/course/module.html"
  to = "/course/modules/:m/"
  status = 301
  force = true
  query = {m = ":m"}

[[redirects]]
  from = "/course/module"
  to = "/course/modules/:m/"
  status = 301
  force = true
  query = {m = ":m"}

[[redirects]]
  from = "/sessions/session.html"
  to = "/sessions/:s/"
  status = 301
  force = true
  query = {s = ":s"}

[[redirects]]
  from = "/sessions/ai-in-finance/application.html"
  to = "/sessions/ai-in-finance/applications/:a/"
  status = 301
  force = true
  query = {a = ":a"}

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
